name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  bugbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install --quiet "PyYAML>=6,<7"

      - name: Collect review signals
        id: signals
        run: |
          set +e
          findings=""
          add() { findings="${findings}$1\n"; }

          if ! python3 scripts/check-pr-boundary.py "origin/${{ github.base_ref }}"; then
            add "- **Boundary:** PR touches both \`internal/\` and \`adapters/\`, or adds Go source without tests."
          fi

          if ! python3 scripts/check-docs-drift.py; then
            add "- **Docs drift:** README or SKILL diverged from \`adapters.yml\`."
          fi

          go test -coverprofile=coverage.out ./... >/dev/null 2>&1
          go install ./cmd/crap4go
          if ! crap4go --dir . --coverage coverage.out --thresholds .gauntlet/thresholds.yml --changed "origin/${{ github.base_ref }}" --format json > crap-pr.json 2>crap-pr.err; then
            if [ -s crap-pr.json ]; then
              failing=$(python3 - <<'PY'
          import json
          data=json.load(open("crap-pr.json"))
          print(data.get("summary",{}).get("failing", "?"))
          PY
          )
              max_crap=$(python3 - <<'PY'
          import json
          data=json.load(open("crap-pr.json"))
          print(data.get("summary",{}).get("max_crap", "?"))
          PY
          )
              add "- **CRAP regression:** ${failing} changed function(s) over ceiling (max CRAP ${max_crap})."
            else
              add "- **CRAP check failed:** $(tr '\n' ' ' < crap-pr.err)"
            fi
          fi

          if [ -z "$findings" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "body=### Gauntlet trust review\n\nAll automated checks passed for this PR shape." >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            printf 'body=### Gauntlet trust review\n\n%s\n' "$findings" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- gauntlet-trust-review -->';
            const body = `${marker}\n${{ steps.signals.outputs.body }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
