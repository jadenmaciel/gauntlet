name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  php-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/php/crap4php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Test
        run: composer test

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --manifest-path adapters/rust/crap4rs/Cargo.toml

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: python -m unittest adapters.python.tests.test_crap4py -v
      - name: Install the console script
        run: python -m pip install ./adapters/python
      - name: Smoke test the installed entry point
        run: crap4py --help

  typescript-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/typescript/crap4ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.6"
          cache: npm
          cache-dependency-path: adapters/typescript/crap4ts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install --quiet "PyYAML>=6,<7"
      - name: Check the docs against adapters.yml
        run: python3 scripts/check-docs-drift.py

  import-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Go import boundaries
        run: python3 scripts/check-import-graph.py

  no-placeholder-ceiling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholder thresholds on main
        run: python3 scripts/check-no-placeholder-ceiling.py

  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20.6"
          cache: npm
          cache-dependency-path: adapters/typescript/crap4ts/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Install TypeScript scorer dependencies
        working-directory: adapters/typescript/crap4ts
        run: npm ci && npm run build
      - name: Install PHP scorer dependencies
        working-directory: adapters/php/crap4php
        run: composer install --no-interaction --prefer-dist
      - name: Install PyYAML
        run: python3 -m pip install --quiet "PyYAML>=6,<7"
      - name: Assert scorer CLI contract
        run: python3 scripts/check-cli-contract.py

  self-gate-crap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate Go coverage
        run: go test -coverprofile=coverage.out ./...
      - name: Install crap4go
        run: go install ./cmd/crap4go
      - name: Score changed Go functions since main
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            changed_ref="origin/${{ github.base_ref }}"
          else
            changed_ref="origin/main"
          fi
          crap4go --dir . --coverage coverage.out --thresholds .gauntlet/thresholds.yml --changed "$changed_ref"
