name: crap4go
description: Install pinned crap4go and fail if any Go function exceeds the CRAP ceiling.
inputs:
  coverage:
    description: Path to a Go coverage profile from `go test -coverprofile`.
    required: false
    default: ""
  profile:
    description: Deprecated alias for `coverage`, kept for pre-v0.2.0 callers.
    required: false
    default: ""
  dir:
    description: Directory to scan for .go files.
    required: false
    default: "."
  thresholds:
    description: Nested thresholds YAML holding metrics.crap_ceiling.value.
    required: false
    default: ".gauntlet/thresholds.yml"
  ceiling-file:
    description: Deprecated alias for `thresholds`, kept for pre-v0.2.0 callers.
    required: false
    default: ""
  ceiling:
    description: Numeric ceiling override. Wins over `thresholds` when set.
    required: false
    default: ""
  changed-ref:
    description: Git ref for --changed. Empty scores the whole tree.
    required: false
    default: ""
  working-directory:
    description: Working directory for git, coverage, and the scan.
    required: false
    default: "."
  version:
    description: crap4go module version.
    required: false
    default: v0.2.0
runs:
  using: composite
  steps:
    - name: Install crap4go
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v go >/dev/null; then
          echo "crap-go: go is not on PATH. Install Go in this job before this Action." >&2
          exit 2
        fi
        gobin="${RUNNER_TEMP}/gauntlet-bin"
        mkdir -p "$gobin"
        GOBIN="$gobin" go install "github.com/jadenmaciel/gauntlet/cmd/crap4go@${{ inputs.version }}"
        echo "$gobin" >> "$GITHUB_PATH"
    - name: Run crap4go
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        coverage="${{ inputs.coverage }}"
        if [ -z "$coverage" ]; then
          coverage="${{ inputs.profile }}"
        fi
        if [ -z "$coverage" ]; then
          echo "crap-go: set the 'coverage' input to a go coverage profile." >&2
          exit 2
        fi

        args=(--dir "${{ inputs.dir }}" --coverage "$coverage")
        ceiling="${{ inputs.ceiling }}"
        if [ -n "$ceiling" ]; then
          args+=(--ceiling "$ceiling")
        else
          thresholds="${{ inputs.ceiling-file }}"
          if [ -z "$thresholds" ]; then
            thresholds="${{ inputs.thresholds }}"
          fi
          args+=(--thresholds "$thresholds")
        fi

        changed_ref="${{ inputs.changed-ref }}"
        if [ -n "$changed_ref" ]; then
          # A shallow CI clone has no merge base with the target branch, so
          # --changed would fail before it scored anything.
          if ! git rev-parse --verify "${changed_ref}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${changed_ref#origin/}"
          fi
          args+=(--changed "$changed_ref")
        fi

        crap4go "${args[@]}"
