name: crap4go
description: Install pinned crap4go and fail if any function exceeds the CRAP ceiling.
inputs:
  profile:
    description: Path to a go coverage profile from go test -coverprofile.
    required: true
  dir:
    description: Directory to scan for .go files.
    required: false
    default: "."
  ceiling-file:
    description: Nested thresholds YAML with metrics.crap_ceiling.value.
    required: false
    default: ".gauntlet/thresholds.yml"
  changed-ref:
    description: Git ref for --changed. Empty scores the whole tree.
    required: false
    default: ""
  working-directory:
    description: Working directory for git, coverage, and the scan.
    required: false
    default: "."
  version:
    description: crap4go module version.
    required: false
    default: v0.1.0
runs:
  using: composite
  steps:
    - name: Install crap4go
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v go >/dev/null; then
          echo "crap-go: go is not on PATH. Install Go in this job before this Action." >&2
          exit 2
        fi
        gobin="${RUNNER_TEMP}/gauntlet-bin"
        mkdir -p "$gobin"
        GOBIN="$gobin" go install "github.com/jadenmaciel/gauntlet/cmd/crap4go@${{ inputs.version }}"
        echo "$gobin" >> "$GITHUB_PATH"
    - name: Run crap4go
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        ceiling_file="${{ inputs.ceiling-file }}"
        ceiling="$(awk '/^  crap_ceiling:/{found=1; next} found && /^    value:/{print $2; exit}' "$ceiling_file")"
        if [ -z "$ceiling" ]; then
          echo "crap-go: could not read metrics.crap_ceiling.value from ${ceiling_file}" >&2
          exit 2
        fi
        extra=()
        changed_ref="${{ inputs.changed-ref }}"
        if [ -n "$changed_ref" ]; then
          short="${changed_ref#origin/}"
          if ! git rev-parse --verify "${changed_ref}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "$short"
          fi
          extra+=(--changed "$changed_ref")
        fi
        crap4go --dir "${{ inputs.dir }}" --profile "${{ inputs.profile }}" --ceiling "$ceiling" "${extra[@]}"
