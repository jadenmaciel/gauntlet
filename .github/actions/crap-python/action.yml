name: crap4py
description: Install pinned crap4py and fail if any Python function exceeds the CRAP ceiling.
inputs:
  coverage:
    description: Path to a Cobertura XML report from `coverage xml` or pytest --cov.
    required: false
    default: coverage.xml
  dir:
    description: Directory to scan for .py files.
    required: false
    default: "."
  thresholds:
    description: Nested thresholds YAML holding metrics.crap_ceiling.value.
    required: false
    default: ".gauntlet/thresholds.yml"
  ceiling:
    description: Numeric ceiling override. Wins over `thresholds` when set.
    required: false
    default: ""
  changed-ref:
    description: Git ref for --changed. Empty scores the whole tree.
    required: false
    default: ""
  format:
    description: text or json.
    required: false
    default: text
  working-directory:
    description: Working directory for git, coverage, and the scan.
    required: false
    default: "."
  version:
    description: gauntlet tag to install crap4py from.
    required: false
    default: v0.2.0
runs:
  using: composite
  steps:
    - name: Install crap4py
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null; then
          echo "crap-python: python3 is not on PATH. Use actions/setup-python before this Action." >&2
          exit 2
        fi
        python3 -m pip install --quiet \
          "git+https://github.com/jadenmaciel/gauntlet@${{ inputs.version }}#subdirectory=adapters/python"
    - name: Run crap4py
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CRAP_COVERAGE: ${{ inputs.coverage }}
        CRAP_DIR: ${{ inputs.dir }}
        CRAP_THRESHOLDS: ${{ inputs.thresholds }}
        CRAP_CEILING: ${{ inputs.ceiling }}
        CRAP_CHANGED: ${{ inputs.changed-ref }}
        CRAP_FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        if [ ! -f "$CRAP_COVERAGE" ]; then
          echo "crap-python: coverage report $CRAP_COVERAGE does not exist. Run your coverage step first." >&2
          exit 2
        fi
        args=(--dir "$CRAP_DIR" --coverage "$CRAP_COVERAGE" --format "$CRAP_FORMAT")
        if [ -n "$CRAP_CEILING" ]; then
          args+=(--ceiling "$CRAP_CEILING")
        else
          args+=(--thresholds "$CRAP_THRESHOLDS")
        fi
        if [ -n "$CRAP_CHANGED" ]; then
          # A shallow CI clone has no merge base with the target branch, so
          # --changed would fail before it scored anything.
          if ! git rev-parse --verify "${CRAP_CHANGED}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${CRAP_CHANGED#origin/}"
          fi
          args+=(--changed "$CRAP_CHANGED")
        fi
        crap4py "${args[@]}"
