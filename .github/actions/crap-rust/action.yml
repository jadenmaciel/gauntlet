name: crap4rs
description: Install pinned crap4rs and fail if any Rust function exceeds the CRAP ceiling.
inputs:
  coverage:
    description: Path to a cargo-llvm-cov JSON export.
    required: false
    default: target/llvm-cov.json
  dir:
    description: Directory to scan for .rs files.
    required: false
    default: "."
  thresholds:
    description: Nested thresholds YAML holding metrics.crap_ceiling.value.
    required: false
    default: ".gauntlet/thresholds.yml"
  ceiling:
    description: Numeric ceiling override. Wins over `thresholds` when set.
    required: false
    default: ""
  changed-ref:
    description: Git ref for --changed. Empty scores the whole tree.
    required: false
    default: ""
  format:
    description: text or json.
    required: false
    default: text
  working-directory:
    description: Working directory for git, coverage, and the scan.
    required: false
    default: "."
  version:
    description: gauntlet tag to install crap4rs from.
    required: false
    default: v0.2.0
runs:
  using: composite
  steps:
    - name: Install crap4rs
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v cargo >/dev/null; then
          echo "crap-rust: cargo is not on PATH. Install a Rust toolchain before this Action." >&2
          exit 2
        fi
        cargo install --git https://github.com/jadenmaciel/gauntlet \
          --tag "${{ inputs.version }}" crap4rs --locked
    - name: Run crap4rs
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CRAP_COVERAGE: ${{ inputs.coverage }}
        CRAP_DIR: ${{ inputs.dir }}
        CRAP_THRESHOLDS: ${{ inputs.thresholds }}
        CRAP_CEILING: ${{ inputs.ceiling }}
        CRAP_CHANGED: ${{ inputs.changed-ref }}
        CRAP_FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        if [ ! -f "$CRAP_COVERAGE" ]; then
          echo "crap-rust: coverage report $CRAP_COVERAGE does not exist. Run cargo llvm-cov --json first." >&2
          exit 2
        fi
        args=(--dir "$CRAP_DIR" --coverage "$CRAP_COVERAGE" --format "$CRAP_FORMAT")
        if [ -n "$CRAP_CEILING" ]; then
          args+=(--ceiling "$CRAP_CEILING")
        else
          args+=(--thresholds "$CRAP_THRESHOLDS")
        fi
        if [ -n "$CRAP_CHANGED" ]; then
          if ! git rev-parse --verify "${CRAP_CHANGED}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${CRAP_CHANGED#origin/}"
          fi
          args+=(--changed "$CRAP_CHANGED")
        fi
        crap4rs "${args[@]}"
