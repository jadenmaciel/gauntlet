[package]
name = "crap4rs"
version = "0.1.0"
edition = "2021"

[dependencies]
proc-macro2 = { version = "1.0.101", features = ["span-locations"] }
rustc-demangle = "0.1.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = { version = "2.0.106", features = ["full", "visit", "parsing"] }
walkdir = "2.5.0"
