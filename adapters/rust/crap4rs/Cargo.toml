[package]
name = "crap4rs"
version = "0.2.0"
edition = "2021"
# description and license are not optional metadata: `cargo publish` refuses
# without them.
description = "CRAP scorer for Rust: cyclomatic complexity joined with cargo-llvm-cov coverage"
license = "MIT"
repository = "https://github.com/jadenmaciel/gauntlet"
readme = "README.md"
keywords = ["crap", "complexity", "coverage", "quality", "ci"]
categories = ["development-tools", "development-tools::testing"]

[dependencies]
proc-macro2 = { version = "1.0.101", features = ["span-locations"] }
rustc-demangle = "0.1.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = { version = "2.0.106", features = ["full", "visit", "parsing"] }
walkdir = "2.5.0"
